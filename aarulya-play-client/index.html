<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070a18"><title>Aarulya Play</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1e2a66 0,#090e25 34%,#050711 100%);color:#fff;font:14px Inter,system-ui,sans-serif}button,input{font:inherit}.app{max-width:1100px;margin:auto;padding:16px 16px 92px}.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}.brand{display:flex;gap:10px;align-items:center}.logo{display:grid;place-items:center;width:45px;height:45px;border-radius:15px;background:linear-gradient(135deg,#22d3ee,#8b5cf6,#ec4899);font-size:24px;font-weight:900;box-shadow:0 12px 35px #8b5cf655}.brand b{font-size:20px}.brand small,.muted{display:block;color:#98a7c8}.icon{width:42px;height:42px;border:1px solid #314064;border-radius:14px;background:#111a35;color:#fff}.wallet{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border:1px solid #40517a;border-radius:22px;background:linear-gradient(120deg,#8b5cf638,#22d3ee12)}.wallet small{color:#b7c2dc;letter-spacing:.12em}.bal{font-size:34px;font-weight:900}.hero{margin-top:16px;min-height:300px;border:1px solid #334366;border-radius:28px;padding:38px;position:relative;overflow:hidden;background:linear-gradient(130deg,#161f42,#0d1733 58%,#281443)}.hero:after{content:'🛸';position:absolute;font-size:120px;right:10%;top:70px;filter:drop-shadow(0 0 35px #a855f7);animation:f 2s infinite alternate}@keyframes f{to{transform:translateY(-18px) rotate(5deg)}}.pill{display:inline-block;padding:7px 11px;border:1px solid #8b5cf680;border-radius:99px;color:#d8ccff;font-size:10px;letter-spacing:.12em}.hero h1{font-size:48px;line-height:1;margin:16px 0 10px;max-width:620px}.hero em{font-style:normal;background:linear-gradient(90deg,#67e8f9,#c4b5fd,#f0abfc);-webkit-background-clip:text;color:transparent}.hero p{color:#b5c1dc;max-width:520px;font-size:16px}.cta{border:0;border-radius:14px;padding:13px 18px;color:#fff;font-weight:800;background:linear-gradient(90deg,#7c3aed,#ec4899);box-shadow:0 12px 30px #8b5cf644}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.quick button{padding:15px;border:1px solid #2c3a5d;border-radius:17px;background:#101831;color:#fff;text-align:left}.quick span{font-size:23px}.quick b,.quick small{display:block}.quick b{margin-top:8px}.quick small{color:#8fa0c2}.section{margin-top:28px}.head{display:flex;align-items:end;justify-content:space-between;gap:10px}.head h2{margin:3px 0 12px;font-size:26px}.head small{color:#8c9abc;letter-spacing:.12em}.search{border:1px solid #314064;border-radius:13px;padding:10px 12px;background:#0d152d;color:#fff;max-width:180px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap;border:1px solid #2b395c;border-radius:99px;padding:9px 14px;background:#0d152c;color:#9cabc9}.tabs .on{background:linear-gradient(90deg,#7c3aed,#a855f7);color:#fff}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.game{border:1px solid #283759;border-radius:18px;background:linear-gradient(155deg,#111a34,#090f21);padding:9px;color:#fff;text-align:left}.cover{display:grid;place-items:center;height:95px;border-radius:14px;background:linear-gradient(145deg,var(--c),#111936);font-size:38px}.game b,.game small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.game b{margin-top:9px}.game small{color:#8e9dbc;margin-top:2px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1100px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 12px calc(9px + env(safe-area-inset-bottom));border:1px solid #263453;border-bottom:0;border-radius:18px 18px 0 0;background:#070b19ee;backdrop-filter:blur(15px)}.nav button{border:0;background:transparent;color:#93a2c2}.nav span{display:block;font-size:19px}.modal{position:fixed;inset:0;display:none;place-items:center;padding:12px;background:#01030bd9;z-index:50}.modal.show{display:grid}.card{position:relative;width:min(500px,100%);max-height:94vh;overflow:auto;border:1px solid #3b4c72;border-radius:26px;background:linear-gradient(160deg,#131c38,#070d1d);box-shadow:0 28px 90px #000;padding:18px}.x{position:absolute;right:13px;top:13px;width:38px;height:38px;border:1px solid #3a496c;border-radius:13px;background:#0d152b;color:#fff;font-size:22px}.ghead{display:flex;gap:12px;align-items:center;padding-right:45px}.gico{display:grid;place-items:center;width:52px;height:52px;border-radius:17px;background:linear-gradient(145deg,#7c3aed,#ec4899);font-size:27px}.stage{height:260px;margin:16px -18px;background:radial-gradient(circle at 50% 120%,#7c3aed99,transparent 45%),linear-gradient(#0c1734,#241143);display:grid;place-items:center;text-align:center}.value{font-size:50px;font-weight:950}.art{font-size:58px;animation:b .55s infinite alternate}@keyframes b{to{transform:translateY(-15px) scale(1.08)}}.stage small{color:#bcc8df}.bet{width:100%;padding:14px;border:1px solid #344568;border-radius:14px;background:#0b142a;color:#fff;font-size:20px;font-weight:800}.play{width:100%;margin-top:11px;border:0;border-radius:15px;padding:15px;background:linear-gradient(90deg,#7c3aed,#ec4899);color:#fff;font-weight:900}.list{margin-top:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #24314f}.good{color:#5eead4}.bad{color:#fda4af}@media(max-width:800px){.grid{grid-template-columns:repeat(4,1fr)}.hero h1{font-size:40px}}@media(max-width:560px){.app{padding:12px 12px 88px}.hero{padding:28px 22px;min-height:390px}.hero:after{font-size:90px;right:28%;top:230px}.hero h1{font-size:38px}.quick{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(3,1fr)}.cover{height:82px}.game b{font-size:12px}.head{align-items:center}.search{width:120px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">A</div><div><b>Aarulya Play</b><small>Multi-Game Platform</small></div></div><button class="icon" id="sound">🔊</button></header><section class="wallet"><div><small>PLAYER WALLET</small><div class="bal">◉ <span id="balance">25,000</span></div><span class="muted">Virtual credits only</span></div><button class="icon" id="profile">AK</button></section><section class="hero"><span class="pill">NEXT-GENERATION ENTERTAINMENT ENGINE</span><h1>One lobby.<br><em>Every kind of play.</em></h1><p>240 original game titles powered by 20 interactive engines.</p><button class="cta" id="featured">PLAY FEATURED</button></section><section class="quick"><button data-sheet="wallet"><span>◈</span><b>Wallet</b><small>Virtual ledger</small></button><button data-sheet="rewards"><span>✦</span><b>Rewards</b><small>Daily missions</small></button><button data-sheet="history"><span>↻</span><b>History</b><small>Round records</small></button><button data-sheet="owner"><span>⚙</span><b>Owner Console</b><small>Platform control</small></button></section><section class="section"><div class="head"><div><small>240 ORIGINAL TITLES</small><h2>Game lobby</h2></div><input class="search" id="search" placeholder="Search games"></div><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div></section></main><nav class="nav"><button id="home"><span>⌂</span>Home</button><button id="games"><span>▦</span>Games</button><button data-sheet="rewards"><span>✦</span>Rewards</button><button data-sheet="owner"><span>◎</span>Owner</button></nav><div class="modal" id="modal"><div class="card"><button class="x" id="close">×</button><div id="content"></div></div></div><script>
const E={CRASH:['Crash','🚀','#8b5cf6'],MINES:['Instant','💎','#14b8a6'],DICE:['Instant','🎲','#f59e0b'],WHEEL:['Wheel','🎡','#ec4899'],COLOR:['Lottery','🔴','#ef4444'],GOAL:['Sports','⚽','#10b981'],HIGH_LOW:['Cards','🃏','#6366f1'],SLOTS:['Slots','🎰','#ec4899'],LOTTERY:['Numbers','🔢','#f97316'],PLINKO:['Arcade','🔵','#3b82f6'],LIMBO:['Instant','📈','#a855f7'],COIN_FLIP:['Quick','🪙','#eab308'],ROULETTE:['Table','🎯','#dc2626'],KENO:['Numbers','5️⃣','#14b8a6'],MEMORY:['Skill','🧠','#8b5cf6'],RACING:['Racing','🏎️','#ef4444'],ARCHERY:['Skill','🏹','#22c55e'],BASKET:['Sports','🏀','#f97316'],TREASURE:['Adventure','🎁','#f59e0b'],TOWER:['Adventure','🗼','#6366f1']},S=['Nova','Royal','Ultra','Prime','Turbo','Mega','Galaxy','Infinity','Pro','Elite','Legend','Max'],N={CRASH:['Sky Rush','Jet Blast'],MINES:['Mine Vault','Treasure Grid'],DICE:['Dice Duel'],WHEEL:['Orbit Wheel'],COLOR:['Color Clash'],GOAL:['Goal Kick'],HIGH_LOW:['Higher Lower'],SLOTS:['Neon Slots'],LOTTERY:['Lucky Number'],PLINKO:['Plinko Drop'],LIMBO:['Limbo Max'],COIN_FLIP:['Coin Royale'],ROULETTE:['Neon Roulette'],KENO:['Keno Blast'],MEMORY:['Memory Master'],RACING:['Turbo Race'],ARCHERY:['Bullseye Pro'],BASKET:['Basket Star'],TREASURE:['Treasure Chest'],TOWER:['Tower Climb']},G=[];Object.entries(E).forEach(([e,[c,i,a]])=>S.forEach((s,x)=>G.push({e,c,i,a,n:(N[e]||[])[x]||s+' '+e.replaceAll('_',' '),id:e+'-'+x})));let D=JSON.parse(localStorage.ap||'{"b":25000,"h":[]}'),cat='All',q='',sel;const $=x=>document.querySelector(x),fmt=n=>Math.floor(n).toLocaleString('en-IN'),ri=n=>Math.floor(Math.random()*n);function save(){localStorage.ap=JSON.stringify(D);$('#balance').textContent=fmt(D.b)}function tabs(){let a=['All',...new Set(G.map(g=>g.c))];$('#tabs').innerHTML=a.map(x=>`<button class="${x===cat?'on':''}" data-cat="${x}">${x}</button>`).join('')}function draw(){let a=G.filter(g=>(cat==='All'||g.c===cat)&&(!q||(g.n+' '+g.c).toLowerCase().includes(q)));$('#grid').innerHTML=a.map(g=>`<button class="game" data-game="${g.id}"><span class="cover" style="--c:${g.a}">${g.i}</span><b>${g.n}</b><small>${g.c}</small></button>`).join('')}function outcome(e){let w=Math.random()>.55,m=w?[1.2,1.5,1.9,2,3,5][ri(6)]:0,v=w?'WIN':'TRY AGAIN';if(e==='CRASH'){let x=(1+Math.random()*8).toFixed(2);v=x+'x';m=+x>=2?2:0;w=m>0}if(e==='DICE')v='ROLL '+ri(100);if(e==='WHEEL')v=['0x','1.2x','2x','5x','10x'][ri(5)];if(e==='COLOR')v=['RED','GREEN','VIOLET'][ri(3)];if(e==='GOAL')v=w?'GOAL':'SAVED';if(e==='SLOTS')v=['7','👑','💎','🍒'].sort(()=>Math.random()-.5).slice(0,3).join(' ');if(e==='PLINKO'||e==='LIMBO')v=(Math.random()*6+.4).toFixed(2)+'x';if(e==='COIN_FLIP')v=Math.random()>.5?'HEADS':'TAILS';if(e==='ROULETTE')v='NUMBER '+ri(37);if(e==='KENO')v='HITS '+ri(6);if(e==='MEMORY')v='SCORE '+ri(101);if(e==='RACING')v='LANE '+(ri(6)+1);if(e==='ARCHERY')v='SCORE '+ri(11);if(e==='BASKET')v=w?'SCORE':'MISS';if(e==='TREASURE')v=w?'TREASURE':'EMPTY';if(e==='TOWER')v=w?'REACHED':'FELL';return{w,m,v}}function openGame(id){sel=G.find(g=>g.id===id);$('#content').innerHTML=`<div class="ghead"><div class="gico">${sel.i}</div><div><small class="muted">${sel.e}</small><h2>${sel.n}</h2></div></div><div class="stage"><div><div class="value" id="v">READY</div><div class="art" id="art">${sel.i}</div><small id="cap">Configure your virtual round</small></div></div><input id="bet" class="bet" type="number" min="100" value="500"><button class="play" id="play">START ROUND</button><small class="muted" style="text-align:center;margin-top:9px">Virtual credits only • no cash value</small>`;$('#modal').classList.add('show');$('#play').onclick=play}function play(){let b=Math.floor(+$('input#bet').value);if(b<100||b>D.b)return $('#cap').textContent='Check virtual credit amount';$('#play').disabled=true;$('#v').textContent='•••';setTimeout(()=>{let r=outcome(sel.e),p=Math.floor(b*r.m);D.b=D.b-b+p;D.h.unshift({n:sel.n,w:r.w,b,p,v:r.v,t:Date.now()});D.h=D.h.slice(0,30);save();$('#v').textContent=r.v;$('#cap').textContent=r.w?'Won '+fmt(p)+' credits':'Round completed';$('#play').disabled=false},850)}function sheet(n){let h=D.h.map(x=>`<div class="row"><div><b>${x.n}</b><small class="muted">${new Date(x.t).toLocaleString()}</small></div><b class="${x.w?'good':'bad'}">${x.w?'+':''}${fmt(x.p)}</b></div>`).join('')||'<p class="muted">No rounds yet.</p>',c='';if(n==='wallet')c=`<h2>Virtual Wallet</h2><div class="wallet"><div><small>BALANCE</small><div class="bal">◉ ${fmt(D.b)}</div></div></div><div class="list">${h}</div>`;if(n==='history')c=`<h2>Game History</h2><div class="list">${h}</div>`;if(n==='rewards')c='<h2>Rewards Centre</h2><div class="list"><div class="row"><span>🎁 Daily check-in</span><b>Active</b></div><div class="row"><span>⚡ Play streak</span><b>0/5</b></div><div class="row"><span>🏆 Weekly mission</span><b>Open</b></div><div class="row"><span>💎 VIP Club</span><b>Level 1</b></div></div>';if(n==='owner')c=`<h2>Owner Platform Console</h2><div class="list"><div class="row"><span>Game titles</span><b>240</b></div><div class="row"><span>Game engines</span><b>20</b></div><div class="row"><span>Recorded rounds</span><b>${D.h.length}</b></div><div class="row"><span>Virtual ledger</span><b class="good">ACTIVE</b></div><div class="row"><span>Real payments</span><b class="bad">DISABLED</b></div></div>`;$('#content').innerHTML=c;$('#modal').classList.add('show')}document.addEventListener('click',e=>{let g=e.target.closest('[data-game]'),t=e.target.closest('[data-cat]'),s=e.target.closest('[data-sheet]');if(g)openGame(g.dataset.game);if(t){cat=t.dataset.cat;tabs();draw()}if(s)sheet(s.dataset.sheet)});$('#search').oninput=e=>{q=e.target.value.toLowerCase();draw()};$('#close').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};$('#featured').onclick=()=>openGame(G[0].id);$('#games').onclick=()=>document.querySelector('.section').scrollIntoView();$('#home').onclick=()=>scrollTo({top:0,behavior:'smooth'});$('#profile').onclick=()=>sheet('owner');$('#sound').onclick=()=>$('#sound').textContent=$('#sound').textContent==='🔊'?'🔇':'🔊';save();tabs();draw();
</script></body></html>
