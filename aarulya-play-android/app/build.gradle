plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aarulya.play'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aarulya.play'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        manifestPlaceholders = [
            admobAppId: project.findProperty('ADMOB_APP_ID') ?: 'ca-app-pub-3940256099942544~3347511713'
        ]

        buildConfigField 'String', 'ADMOB_BANNER_ID', '"' + (project.findProperty('ADMOB_BANNER_ID') ?: 'ca-app-pub-3940256099942544/9214589741') + '"'
        buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', '"' + (project.findProperty('ADMOB_INTERSTITIAL_ID') ?: 'ca-app-pub-3940256099942544/1033173712') + '"'
        buildConfigField 'String', 'ADMOB_REWARDED_ID', '"' + (project.findProperty('ADMOB_REWARDED_ID') ?: 'ca-app-pub-3940256099942544/5224354917') + '"'
        buildConfigField 'boolean', 'LIVE_ADS_ENABLED', (project.findProperty('LIVE_ADS_ENABLED') ?: 'false')
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDirs = ['../web-assets']
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
